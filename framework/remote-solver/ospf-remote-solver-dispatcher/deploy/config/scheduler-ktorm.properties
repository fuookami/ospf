event.adapter=kafka
event.kafka.bootstrap-servers=127.0.0.1:9092
event.kafka.client-id=remote-solver-event-port
event.kafka.consumer-poll-interval-ms=200
event.kafka.query-poll-timeout-ms=1500
event.kafka.query-max-poll-rounds=8
event.kafka.query-topics=SolvingRequest,TaskResult,SliceLifecycle,MonitorAlert

# Ktorm-backed state ports / 使用 Ktorm 的状态端口
distributed-lock.adapter=ktorm
distributed-lock.ktorm.url=jdbc:postgresql://127.0.0.1:5432/remote_solver

node-state.adapter=ktorm
node-state.ktorm.url=jdbc:postgresql://127.0.0.1:5432/remote_solver

budget.adapter=ktorm
budget.ktorm.url=jdbc:postgresql://127.0.0.1:5432/remote_solver

task-state.adapter=ktorm
task-state.ktorm.url=jdbc:postgresql://127.0.0.1:5432/remote_solver

cost-ledger.adapter=ktorm
cost-ledger.ktorm.url=jdbc:postgresql://127.0.0.1:5432/remote_solver

solver-execution.adapter=ospf
solver-execution.ospf.bridge-class=fuookami.ospf.framework.remote_solver.adapter.ospf.OspfExternalProcessBridge
solver-execution.ospf.bridge.arg.command=mvn -q -DskipTests org.codehaus.mojo:exec-maven-plugin:3.5.0:java -Dexec.mainClass=fuookami.ospf.framework.remote_solver.bootstrap.RemoteSolverWorkerMain -- --state-dir target/remote-solver-worker-state --total-runtime-ms 12000

storage.adapter=localfs
storage.localfs.root=./data/remote-solver

scheduler.loop.interval-ms=200
scheduler.performance-learning.enabled=true
scheduler.performance-learning.rate=0.2
scheduler.performance-learning.score-min=0.1
scheduler.performance-learning.score-max=10.0

