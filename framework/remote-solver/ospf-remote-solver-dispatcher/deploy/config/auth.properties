# JWT Authentication Configuration
# Enable and configure JWT-based authentication for Remote Solver API

# Enable JWT authentication (default: false)
auth.jwt.enabled=false

# HMAC secret key for HS256 signature verification
# For production, use a secure random string of at least 256 bits
# Either secret (HS256) or publicKey (RS256) must be configured
auth.jwt.secret=your-secret-key-change-in-production

# RSA public key for RS256 signature verification (alternative to secret)
# Base64-encoded X509 public key (DER format)
# auth.jwt.public-key-base64=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA...

# Or PEM-formatted public key (with BEGIN/END markers)
# auth.jwt.public-key=-----BEGIN PUBLIC KEY-----\nMIIBIjANBg...\n-----END PUBLIC KEY-----

# Expected token issuer (optional)
# If set, tokens with mismatched issuer will be rejected
auth.jwt.issuer=https://your-oidc-provider.example.com

# Expected token audience (optional)
# If set, tokens without matching audience will be rejected
auth.jwt.audience=remote-solver-api

# Claim name for tenant ID extraction (default: tenant_id)
# Common alternatives: tid, tenant_id, custom_tenant
auth.jwt.tenant-claim=tenant_id

# Claim name for roles extraction (default: roles)
# Common alternatives: role, groups, permissions
auth.jwt.roles-claim=roles

# Clock skew tolerance in seconds (default: 60)
# Allows for time differences between servers
auth.jwt.clock-skew-seconds=60

# Require expiration claim in tokens (default: true)
auth.jwt.require-expiration=true

# Require issuer claim in tokens (default: false)
auth.jwt.require-issuer=false

# Monitor authentication settings
# These control access to monitoring endpoints (/monitor, /api/v1/monitor/*)
monitor.auth.enabled=true
monitor.login-url=/login
monitor.allowed-roles=admin,monitor_read,operator

# Tenant authentication settings
# These control tenant-based access control
tenant.validation.enabled=false
tenant.header.name=X-Tenant-Id