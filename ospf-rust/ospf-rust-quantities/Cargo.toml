[package]
name = "ospf-rust-quantities"
version = "1.1.0"
edition = "2024"
authors = ["fuookami <wfuookami@gmail.com>"]
description = "Quantities for ospf-rust."
license = "MIT"

homepage = "https://github.com/fuookami/ospf-rust"
repository = "https://github.com/fuookami/ospf-rust"
readme = "README.md"

[dependencies]
bigdecimal = "0.4.10"
num-rational = "0.4.2"
num-bigint = "0.4.8"
num-traits = "0.2.19"
once_cell = "1.21.4"
typenum = "1.20.1"
thiserror = "2.0.20"

[dependencies.ospf-rust-base]
path = "../ospf-rust-base"
version = "1.1.0"

[dependencies.ospf-rust-math]
path = "../ospf-rust-math"
version = "1.1.0"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "quantity_bench"
harness = false
