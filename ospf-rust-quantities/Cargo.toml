[package]
name = "ospf-rust-quantities"
version = "0.1.0"
edition = "2024"
authors = ["fuookami <wfuookami@gmail.com>"]
description = "Quantities for ospf-rust."
license = "MIT"

homepage = "https://github.com/fuookami/ospf-rust"
repository = "https://github.com/fuookami/ospf-rust"
readme = "../README.md"

[dependencies]
bigdecimal = "0.4"
num-rational = "0.4"
num-bigint = "0.4"
once_cell = "1.20"
typenum = "1.17"

[dependencies.ospf-rust-base]
path = "../ospf-rust-base"
version = "0.1.0"

[dependencies.ospf-rust-math]
path = "../ospf-rust-math"
version = "0.1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "quantity_bench"
harness = false

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
