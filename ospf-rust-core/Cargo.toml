[package]
name = "ospf-rust-core"
version = "0.1.0"
authors = ["fuookami <wfuookami@gmail.com>"]
edition = "2021"
license = "Apache-2.0"

homepage = "https://github.com/fuookami/ospf-rust"
repository = "https://github.com/fuookami/ospf-rust"
readme = "../README.md"

[dependencies]
paste = "1.0.15"
num_cpus = "1.16.0"
typed-arena = "2.0.2"
bimap = "0.6.3"
log = "0.4.22"

[dependencies.ospf-rust-base]
path = "../ospf-rust-base"

[dependencies.ospf-rust-math]
path = "../ospf-rust-math"

[dependencies.ospf-rust-multiarray]
path = "../ospf-rust-multiarray"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
