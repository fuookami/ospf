name: SCIP Non-Bundled Tests (Self-Hosted)

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: "Self-hosted runner OS"
        required: true
        default: linux
        type: choice
        options:
          - linux
          - windows

jobs:
  scip-non-bundled-linux:
    if: ${{ inputs.target_os == 'linux' }}
    runs-on:
      - self-hosted
      - linux
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Validate SCIP environment
        shell: bash
        run: |
          set -euo pipefail
          bash ./ospf-rust-core/src/solver/solvers/scip/check_non_bundled_env.sh

      - name: Non-bundled regression (core/framework sync+async)
        shell: bash
        run: |
          set -euo pipefail
          bash ./ospf-rust-core/src/solver/solvers/scip/run_non_bundled_regression.sh

  scip-non-bundled-windows:
    if: ${{ inputs.target_os == 'windows' }}
    runs-on:
      - self-hosted
      - windows
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Validate SCIP environment
        shell: pwsh
        run: |
          ./ospf-rust-core/src/solver/solvers/scip/check_non_bundled_env.ps1

      - name: Non-bundled regression (core/framework sync+async)
        shell: pwsh
        run: |
          ./ospf-rust-core/src/solver/solvers/scip/run_non_bundled_regression.ps1
