name: Core Phase5 Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  core-phase5-gate:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run phase5 gate
        run: bash scripts/phase5_gate.sh
