name: SCIP Bundled Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  scip-bundled-sync:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Resolve LIBCLANG_PATH
        run: |
          LIBCLANG_SO="$(ldconfig -p | grep -E 'libclang\.so(\.[0-9]+)*$' | head -n1 | awk '{print $4}')"
          if [ -z "$LIBCLANG_SO" ]; then
            LIBCLANG_SO="$(find /usr/lib -type f -name 'libclang.so*' | head -n1)"
          fi
          if [ -z "$LIBCLANG_SO" ]; then
            echo "libclang.so not found"
            exit 1
          fi
          echo "LIBCLANG_PATH=$(dirname "$LIBCLANG_SO")" >> "$GITHUB_ENV"
          echo "Resolved LIBCLANG_SO=$LIBCLANG_SO"

      - name: Core native callback integration
        run: cargo test -p ospf-rust-core --test scip_native_observer_integration --features scip-bundled -- --nocapture

      - name: Framework native callback integration
        run: cargo test -p ospf-rust-framework --test scip_native_callback_integration --features scip-bundled -- --nocapture

      - name: Framework async native callback integration
        run: cargo test -p ospf-rust-framework --test scip_native_callback_async_integration --features "scip-bundled async" -- --nocapture
